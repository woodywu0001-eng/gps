name: Build APK

on:
  push:
    branches: [gps-switch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk GpsSwitch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GpsSwitch-apk
          path: GpsSwitch.apk

      # 在 GitHub 的 Releases 頁面放一份 APK，手機可以直接下載
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GpsSwitch build ${{ github.run_number }}
          files: GpsSwitch.apk
